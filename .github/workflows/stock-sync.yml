name: Sales Vision · Stock diário
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sales-vision-stock-sync
  cancel-in-progress: false
jobs:
  sync:
    if: vars.SALES_VISION_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run sync
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          GRAPH_MAILBOX: ${{ vars.GRAPH_MAILBOX }}
          GRAPH_FOLDER_ID: ${{ vars.GRAPH_FOLDER_ID }}
          GRAPH_ALLOWED_SENDER: ${{ vars.GRAPH_ALLOWED_SENDER }}
